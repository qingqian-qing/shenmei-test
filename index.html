<title>ロリコン</title>
<style>

  .disclaimer{font-size:9px;color:rgba(180,120,140,.18);margin-top:3px}
  .page{animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
