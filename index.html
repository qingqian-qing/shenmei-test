<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>审美引力场测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f0f0f;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

/* 封面 */
.cover{text-align:center;max-width:400px}
.cover h1{font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,#ff6b9d,#c44dff,#6bc5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cover .sub{color:#888;font-size:14px;margin-bottom:32px}
.cover .hint{color:#555;font-size:12px;margin-bottom:24px;line-height:1.8}
.btn{display:inline-block;padding:14px 48px;border-radius:50px;font-size:16px;cursor:pointer;border:none;transition:all .3s}
.btn-start{background:linear-gradient(135deg,#ff6b9d,#c44dff);color:#fff;font-weight:600;letter-spacing:1px}
.btn-start:active{transform:scale(.95);opacity:.8}

/* 题目区 */
.quiz{max-width:420px;width:100%;display:none}
.quiz.active{display:block}
.progress-wrap{height:4px;background:#222;border-radius:2px;margin-bottom:28px}
.progress-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,#ff6b9d,#c44dff);transition:width .4s}
.progress-text{color:#666;font-size:12px;text-align:right;margin-bottom:8px}
.question{font-size:19px;line-height:1.6;margin-bottom:28px;color:#f0f0f0}
.options{display:flex;flex-direction:column;gap:12px}
.option{display:block;padding:16px 20px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;color:#ccc;font-size:15px;cursor:pointer;transition:all .2s;text-align:left;width:100%}
.option:active{background:#2a2a2a;border-color:#c44dff;color:#fff}

/* 结果区 */
.result{max-width:420px;width:100%;display:none;text-align:center}
.result.active{display:block}
.result .emoji{font-size:64px;margin-bottom:16px}
.result .label{font-size:13px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.result .verdict{font-size:24px;font-weight:700;margin-bottom:6px;color:#fff}
.result .percent{font-size:48px;font-weight:800;margin:16px 0;background:linear-gradient(135deg,#ff6b9d,#c44dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result .content{color:#aaa;font-size:15px;line-height:1.8;margin:24px 0;text-align:left;padding:20px;background:#1a1a1a;border-radius:12px}
.result .content p{margin-bottom:12px}
.btn-share{margin-top:8px;padding:12px 36px;background:#fff;color:#000;font-weight:600;border-radius:50px;font-size:14px;cursor:pointer;border:none;width:100%}

/* 页脚 */
.footer{color:#333;font-size:11px;margin-top:40px;text-align:center}
</style>
</head>
<body>

<!-- 封面 -->
<div class="cover" id="cover">
<h1>🎨 审美引力场</h1>
<div class="sub">10道题 · 测测你的隐藏审美偏好</div>
<div class="hint">
表面是审美测试<br>你猜到底在测什么？
</div>
<button class="btn btn-start" onclick="start()">开始测试</button>
</div>

<!-- 题目 -->
<div class="quiz" id="quiz">
<div class="progress-text" id="progText">1/10</div>
<div class="progress-wrap"><div class="progress-bar" id="progBar" style="width:0"></div></div>
<div class="question" id="qText"></div>
<div class="options" id="opts"></div>
</div>

<!-- 结果 -->
<div class="result" id="result">
<div class="emoji" id="rEmoji"></div>
<div class="label" id="rLabel"></div>
<div class="verdict" id="rVerdict"></div>
<div class="percent" id="rPercent"></div>
<div class="content" id="rContent"></div>
<button class="btn-share" onclick="share()">📋 截图发群里</button>
<button class="btn btn-start" style="margin-top:12px;background:transparent;border:1px solid #333;color:#888;width:100%" onclick="location.reload()">再来一次</button>
</div>

<div class="footer">仅供娱乐 · 别太当真</div>

"需要被保护的那一类型", "可靠成熟的大姐姐型", "冷酷寡言但内心温柔型", "搞笑担当气氛组"], "s": [3, 0, 1, 1]}, {"id": 20, "q": "你觉得女生最好的皮肤状态是？", "a": ["白里透粉，看着就很软", "健康自然，有点瑕疵也真实", "小麦色，有光泽", "皮肤好不好不重要"], "s": [3, 1, 0, 1]}, {"id": 21, "q": "你觉得肩膀窄窄的女生？", "a": ["很有保护欲，看起来柔和", "正常，女生肩膀本来就比男生窄", "不如宽肩撑衣服好看", "没关注过肩膀"], "s": [3, 1, 0, 1]}, {"id": 22, "q": "小步快跑这个动作，你觉得？", "a": ["很灵动，像小鸟", "正常跑步姿势而已", "不够大方", "没注意过跑步"], "s": [3, 1, 0, 1]}, {"id": 23, "q": "说话声音偏软偏细的女生？", "a": ["喜欢，听着很舒服", "正常，每个人音色不同", "有点刺耳，容易听不清", "不在意声音"], "s": [3, 1, 0, 1]}, {"id": 24, "q": "穿oversize卫衣显得整个人小小的？", "a": ["很戳我，反差感", "休闲穿搭，正常", "不如穿合身的显精神", "没注意过"], "s": [3, 1, 0, 1]}, {"id": 25, "q": "女生不经意间拉你袖子的动作？", "a": ["心跳会漏一拍", "有被需要的感觉", "有点越界了", "没经历过"], "s": [3, 2, 0, 1]}, {"id": 26, "q": "你觉得「软」是用来夸人的吗？", "a": ["是，而且是高度赞美", "中性词，描述性格或外表", "不太算，说明没主见", "没用过这个词形容人"], "s": [3, 1, 0, 1]}, {"id": 27, "q": "以下哪种场景最容易被触动？", "a": ["一个很小的身影在努力做一件很大的事", "两个势均力敌的人激烈对抗", "一个人沉默地扛下所有", "一群朋友嬉闹的日常"], "s": [3, 0, 1, 1]}, {"id": 28, "q": "你觉得女生最加分的配饰是？", "a": ["小小的蝴蝶结发夹", "简约精致的耳环", "有质感的手表", "不觉得配饰能加分"], "s": [3, 0, 0, 1]}, {"id": 29, "q": "「天真」和「幼稚」的区别是？", "a": ["天真是褒义幼稚是贬义，都跟年龄无关", "差不多，只是语气区别", "过了某个年龄天真就是幼稚", "没细想过这两个词"], "s": [3, 1, 0, 1]}, {"id": 30, "q": "做完这个测试，你觉得它在测什么？", "a": ["审美偏好/喜欢的类型", "性格深层投射", "恋爱倾向", "完全猜不到"], "s": [2, 1, 1, 1]}];

const RESULTS = [
  {min:27,emoji:'🔴',label:'纯度',verdict:'典，太典了。',
   content:"别解释。解释就是掩饰。<br><br>你点进来那一刻我就知道了。正常人不会在「踮脚够不到东西」那道题上想超过两秒。<br><br>你喜欢大眼睛、小动作、软乎乎的那一款——不是喜欢，是看到就走不动路。<br><br>二次元也好三次元也好，你的心跳永远为「小小一只」加速。<br><br>注意分寸，祝你好运。"},
  {min:20,emoji:'🟠',label:'纯度',verdict:'有说法，但不承认。',
   content:"你嘴上说「我只是觉得可爱而已」，但你猜为什么可爱那么多款你偏偏觉得这款可爱。<br><br>你就是喜欢那种眼里亮晶晶、笑起来像小太阳、让你忍不住想揉脑袋的类型。<br><br>别人问你理想型，你描述了半天，对方说——「你说的是不是那个谁来着？」<br><br>懂的都懂。只是你还没承认。"},
  {min:13,emoji:'🟡',label:'纯度',verdict:'正常人，别紧张。',
   content:"你的审美比较正常，没什么特别的偏向。<br><br>有时候刷到可爱向的视频会停下来看两眼，但转头又能欣赏成熟大姐姐。<br><br>你喜欢的东西比较杂，自己都说不清楚到底吃哪一款。<br><br>但测试显示你选了几个关键题的答案——你自己可能都没注意到。<br><br>没事，不重要，继续做你的杂食党。"},
  {min:6,emoji:'🟢',label:'纯度',verdict:'你不是。下一个。',
   content:"这款对你来说大概率无感，甚至有点不理解别人为什么上头。<br><br>你觉得成熟、知性、或者干脆飒爽利落的类型更吸引你。<br><br>选到大眼睛双马尾的那些选项时，你基本都选了 C 或 D。<br><br>你不是目标用户。但来都来了，截图发群里看看朋友什么分数。"},
  {min:0,emoji:'⚪',label:'纯度',verdict:'你来做这个测试干嘛？',
   content:"你全程大概在想「这些选项有什么区别」。<br><br>别人看的是萌点，你看的是——什么都没看，你直接划过去了。<br><br>你甚至可能觉得上面那些鉴定结果都写的是中文但你看不懂。<br><br>没关系，这是好事。你的审美雷达和你本人一样纯粹——纯粹不在这个频道上。<br><br>发群里能拿最高赞，因为所有人都觉得你的结果最好笑。"}
];

let currentIdx = 0;
let picked = [];
let score = 0;

function shuffle(arr){
  let a=[...arr];
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function start(){
  picked = shuffle(ALL).slice(0,10);
  score=0; currentIdx=0;
  document.getElementById('cover').style.display='none';
  document.getElementById('result').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  renderQuestion();
}

function renderQuestion(){
  if(currentIdx>=10){
    showResult(); return;
  }
  let q=picked[currentIdx];
  document.getElementById('progText').textContent=(currentIdx+1)+'/10';
  document.getElementById('progBar').style.width=((currentIdx)/10*100)+'%';
  document.getElementById('qText').textContent=q.q;
  let html='';
  let labels=['A','B','C','D'];
  q.a.forEach((ans,i)=>{
    html+='<button class="option" onclick="answer('+i+')">'+ans+'</button>';
  });
  document.getElementById('opts').innerHTML=html;
}

function answer(i){
  score += picked[currentIdx].s[i];
  currentIdx++;
  document.getElementById('progBar').style.width=((currentIdx)/10*100)+'%';
  if(currentIdx>=10){
    setTimeout(showResult,300);
  }else{
    setTimeout(renderQuestion,200);
  }
}

function showResult(){
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('result').classList.add('active');
  let r=RESULTS.find(x=>score>=x.min);
  let pct=Math.round(score/30*100);
  document.getElementById('rEmoji').textContent=r.emoji;
  document.getElementById('rLabel').textContent=r.label;
  document.getElementById('rVerdict').textContent=r.verdict;
  document.getElementById('rPercent').textContent=pct+'%';
  document.getElementById('rContent').innerHTML='<p>'+r.content.replace(/
/g,'</p><p>')+'</p>';
}

function share(){
  if(navigator.share){
    navigator.share({title:'我的审美测试结果',url:location.href}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(location.href).then(()=>{alert('链接已复制，发给朋友吧~')});
  }
}
</script>

</body>
</html>
