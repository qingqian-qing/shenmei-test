<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>审美引力场测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#cover{text-align:center;max-width:400px}
#cover h1{font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,#ff6b9d,#c44dff,#6bc5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#cover .sub{color:#888;font-size:14px;margin-bottom:32px}
#cover .hint{color:#555;font-size:12px;margin-bottom:24px;line-height:1.8}
button{border:none;cursor:pointer}
#quiz,#result{max-width:420px;width:100%;display:none}
#quiz.show,#result.show{display:block}
#progWrap{height:4px;background:#222;border-radius:2px;margin-bottom:28px}
#progBar{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#ff6b9d,#c44dff);transition:width .3s}
#progText{color:#666;font-size:12px;text-align:right;margin-bottom:8px}
#qText{font-size:19px;line-height:1.6;margin-bottom:28px;color:#f0f0f0}
#opts{display:flex;flex-direction:column;gap:12px}
#opts button{padding:16px 20px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;color:#ccc;font-size:15px;text-align:left;width:100%;transition:all .2s}
#opts button:active{background:#2a2a2a;border-color:#c44dff;color:#fff}
#result{text-align:center}
#rEmoji{font-size:64px;margin-bottom:16px}
#rLabel{font-size:13px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
#rVerdict{font-size:24px;font-weight:700;color:#fff;margin-bottom:6px}
#rPercent{font-size:48px;font-weight:800;margin:16px 0;background:linear-gradient(135deg,#ff6b9d,#c44dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#rContent{color:#aaa;font-size:15px;line-height:1.8;margin:24px 0;text-align:left;padding:20px;background:#1a1a1a;border-radius:12px}
#rContent p{margin-bottom:12px}
#btnStart{padding:14px 48px;border-radius:50px;font-size:16px;background:linear-gradient(135deg,#ff6b9d,#c44dff);color:#fff;font-weight:600;letter-spacing:1px}
#btnStart:active{transform:scale(.95);opacity:.8}
#btnShare{margin-top:8px;padding:12px 36px;background:#fff;color:#000;font-weight:600;border-radius:50px;font-size:14px;width:100%}
#btnRetry{margin-top:12px;padding:14px;background:transparent;border:1px solid #333!important;color:#888;width:100%;border-radius:50px;font-size:14px}
footer{color:#333;font-size:11px;margin-top:40px;text-align:center}
</style>
</head>
<body>

<div id="cover">
  <h1>🎨 审美引力场</h1>
  <div class="sub">10道题 · 测测你的隐藏审美偏好</div>
  <div class="hint">表面是审美测试<br>你猜到底在测什么？</div>
  <button id="btnStart">开始测试</button>
</div>

<div id="quiz">
  <div id="progText">1/10</div>
  <div id="progWrap"><div id="progBar"></div></div>
  <div id="qText"></div>
  <div id="opts"></div>
</div>

<div id="result">
  <div id="rEmoji"></div>
  <div id="rLabel"></div>
  <div id="rVerdict"></div>
  <div id="rPercent"></div>
  <div id="rContent"></div>
  <button id="btnShare">📋 截图发群里</button>
  <button id="btnRetry">再来一次</button>
</div>

<footer>仅供娱乐 · 别太当真</footer>

<script>

var Q=[
{q:"第一眼看女生，你通常最先注意到？",a:["眼睛大不大、亮不亮","整体身形比例","穿搭有没有品味","气质和姿态"],s:[3,1,1,0]},
{q:"以下哪种脸型你更觉得舒服？",a:["偏圆润，线条柔和，有点婴儿肥","标准鹅蛋脸，比例精致","偏瘦长，棱角分明有气场","没注意过脸型"],s:[3,1,0,1]},
{q:"女生多高你觉得刚刚好？",a:["150出头，娇小一只","160左右，比较标准","165+，高挑有气场","身高不重要"],s:[3,1,0,1]},
{q:"以下哪种眼睛最吸引你？",a:["又圆又大，亮晶晶像会说话","细长勾人，有点魅","大小适中，双眼皮标致","看整体，眼睛不是决定性因素"],s:[3,0,1,1]},
{q:"你觉得女生最好看的发型是？",a:["双马尾，活泼元气","及腰长直发，温柔","齐耳短发，干练利落","大波浪，成熟有味道"],s:[3,2,1,0]},
{q:"齐刘海在你这儿是？",a:["加分，看起来乖巧可爱","看人，有的适合有的不适合","减分，显幼稚","没注意过刘海"],s:[3,1,0,1]},
{q:"看到女生穿短裙配过膝袜，你觉得？",a:["绝杀，太好看了","看整体搭配","不如光腿自然","有点刻意"],s:[3,1,1,0]},
{q:"女生什么体型最让你多看两眼？",a:["小骨架，瘦瘦小小一只","匀称有线条，健康感","曲线分明，有女人味","没关注过体型"],s:[3,1,0,1]},
{q:"一个人走路蹦蹦跳跳的，你觉得？",a:["挺可爱的，元气满满","有点不稳重","看年龄和场合","没注意过走路方式"],s:[3,0,1,1]},
{q:"女生歪头看着你表示疑惑，你心里？",a:["被戳中了，有点萌","正常表情，没什么特别","觉得这人是不是没听懂","没注意过歪头这个动作"],s:[3,1,0,1]},
{q:"笑起来眼睛弯成月牙的女生，你觉得？",a:["治愈，看到也想跟着笑","挺亲切的","不如露齿大笑好看","没注意过笑起来的眼睛"],s:[3,2,0,1]},
{q:"袖子长过手指只露出指尖，你觉得？",a:["很有感觉，像小动物","衣服不合身吧","一种穿搭风格","没注意过这种细节"],s:[3,0,1,1]},
{q:"双手捧着一个杯子慢慢喝东西，你觉得？",a:["画面很乖，有点温馨","正常动作，没什么","太小心翼翼了","没观察过喝水姿势"],s:[3,1,0,1]},
{q:"踮脚够高处东西够不着的样子？",a:["挺可爱的，想帮忙","有点狼狈","正常，个子矮没办法","没注意过这种场景"],s:[3,0,1,1]},
{q:"躲在别人身后只探出半个头看你？",a:["这个动作杀我","是不是太害羞了","有点做作","没注意过"],s:[3,0,1,1]},
{q:"说话带「呀」「嘛」「呢」之类尾音，你觉得？",a:["软软的，听着很舒服","正常，很多人这样","有点嗲，不太喜欢","没注意过语气词"],s:[3,1,0,1]},
{q:"鼓腮帮子这个动作，你觉得？",a:["犯规级别的可爱","偶尔做还行，别频繁","有点幼稚","没注意过"],s:[3,1,0,1]},
{q:"女生困了揉眼睛的样子？",a:["很柔软，想让她去睡","正常，谁困了都揉","显得没精神","没注意过"],s:[3,1,0,1]},
{q:"看番时你对哪种女角色最容易有好感？",a:["需要被保护的那一类型","可靠成熟的大姐姐型","冷酷寡言但内心温柔型","搞笑担当气氛组"],s:[3,0,1,1]},
{q:"你觉得女生最好的皮肤状态是？",a:["白里透粉，看着就很软","健康自然，有点瑕疵也真实","小麦色，有光泽","皮肤好不好不重要"],s:[3,1,0,1]},
{q:"你觉得肩膀窄窄的女生？",a:["很有保护欲，看起来柔和","正常，女生肩膀本来就比男生窄","不如宽肩撑衣服好看","没关注过肩膀"],s:[3,1,0,1]},
{q:"小步快跑这个动作，你觉得？",a:["很灵动，像小鸟","正常跑步姿势而已","不够大方","没注意过跑步"],s:[3,1,0,1]},
{q:"说话声音偏软偏细的女生？",a:["喜欢，听着很舒服","正常，每个人音色不同","有点刺耳，容易听不清","不在意声音"],s:[3,1,0,1]},
{q:"穿oversize卫衣显得整个人小小的？",a:["很戳我，反差感","休闲穿搭，正常","不如穿合身的显精神","没注意过"],s:[3,1,0,1]},
{q:"女生不经意间拉你袖子的动作？",a:["心跳会漏一拍","有被需要的感觉","有点越界了","没经历过"],s:[3,2,0,1]},
{q:"你觉得「软」是用来夸人的吗？",a:["是，而且是高度赞美","中性词，描述性格或外表","不太算，说明没主见","没用过这个词形容人"],s:[3,1,0,1]},
{q:"以下哪种场景最容易被触动？",a:["一个很小的身影在努力做一件很大的事","两个势均力敌的人激烈对抗","一个人沉默地扛下所有","一群朋友嬉闹的日常"],s:[3,0,1,1]},
{q:"你觉得女生最加分的配饰是？",a:["小小的蝴蝶结发夹","简约精致的耳环","有质感的手表","不觉得配饰能加分"],s:[3,0,0,1]},
{q:"「天真」和「幼稚」的区别是？",a:["天真是褒义幼稚是贬义，都跟年龄无关","差不多，只是语气区别","过了某个年龄天真就是幼稚","没细想过这两个词"],s:[3,1,0,1]},
{q:"做完这个测试，你觉得它在测什么？",a:["审美偏好/喜欢的类型","性格深层投射","恋爱倾向","完全猜不到"],s:[2,1,1,1]}
];

var R=[
{min:27,e:'🔴',l:'纯度',v:'典，太典了。',c:'<p>别解释。解释就是掩饰。</p><p>你点进来那一刻我就知道了。正常人不会在「踮脚够不到东西」那道题上想超过两秒。</p><p>你喜欢大眼睛、小动作、软乎乎的那一款——不是喜欢，是看到就走不动路。</p><p>二次元也好三次元也好，你的心跳永远为「小小一只」加速。</p><p>注意分寸，祝你好运。</p>'},
{min:20,e:'🟠',l:'纯度',v:'有说法，但不承认。',c:'<p>你嘴上说「我只是觉得可爱而已」，但你猜为什么可爱那么多款你偏偏觉得这款可爱。</p><p>你就是喜欢那种眼里亮晶晶、笑起来像小太阳、让你忍不住想揉脑袋的类型。</p><p>别人问你理想型，你描述了半天，对方说——「你说的是不是那个谁来着？」</p><p>懂的都懂。只是你还没承认。</p>'},
{min:13,e:'🟡',l:'纯度',v:'正常人，别紧张。',c:'<p>你的审美比较正常，没什么特别的偏向。</p><p>有时候刷到可爱向的视频会停下来看两眼，但转头又能欣赏成熟大姐姐。</p><p>你喜欢的东西比较杂，自己都说不清楚到底吃哪一款。</p><p>但测试显示你选了几个关键题的答案——你自己可能都没注意到。</p><p>没事，不重要，继续做你的杂食党。</p>'},
{min:6,e:'🟢',l:'纯度',v:'你不是。下一个。',c:'<p>这款对你来说大概率无感，甚至有点不理解别人为什么上头。</p><p>你觉得成熟、知性、或者干脆飒爽利落的类型更吸引你。</p><p>选到大眼睛双马尾的那些选项时，你基本都选了 C 或 D。</p><p>你不是目标用户。但来都来了，截图发群里看看朋友什么分数。</p>'},
{min:0,e:'⚪',l:'纯度',v:'你来做这个测试干嘛？',c:'<p>你全程大概在想「这些选项有什么区别」。</p><p>别人看的是萌点，你看的是——什么都没看，你直接划过去了。</p><p>你甚至可能觉得上面那些鉴定结果都写的是中文但你看不懂。</p><p>没关系，这是好事。你的审美雷达和你本人一样纯粹——纯粹不在这个频道上。</p><p>发群里能拿最高赞，因为所有人都觉得你的结果最好笑。</p>'}
];

var idx=0,picked=[],score=0;

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function show(s){
  document.getElementById('cover').style.display=s==='cover'?'':'none';
  var q=document.getElementById('quiz');
  var r=document.getElementById('result');
  q.className=s==='quiz'?'show':'';
  r.className=s==='result'?'show':'';
}

function render(){
  if(idx>=10){finish();return;}
  var q=picked[idx];
  document.getElementById('progText').textContent=(idx+1)+'/10';
  document.getElementById('progBar').style.width=(idx/10*100)+'%';
  document.getElementById('qText').textContent=q.q;
  var h='';
  for(var i=0;i<q.a.length;i++){
    h+='<button data-i="'+i+'">'+q.a[i]+'</button>';
  }
  document.getElementById('opts').innerHTML=h;
}

function answer(i){
  score+=picked[idx].s[i];
  idx++;
  document.getElementById('progBar').style.width=(idx/10*100)+'%';
  setTimeout(function(){
    if(idx>=10){finish();}else{render();}
  },200);
}

function finish(){
  show('result');
  var res;
  for(var i=0;i<R.length;i++){if(score>=R[i].min){res=R[i];break;}}
  var pct=Math.round(score/30*100);
  document.getElementById('rEmoji').textContent=res.e;
  document.getElementById('rLabel').textContent=res.l+' '+pct+'%';
  document.getElementById('rVerdict').textContent=res.v;
  document.getElementById('rContent').innerHTML=res.c;
}

function share(){
  if(navigator.share){
    navigator.share({title:'我的审美引力场测试结果',url:location.href}).catch(function(){});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(location.href).then(function(){alert('链接已复制！')});
  }
}

document.getElementById('btnStart').onclick=function(){
  picked=shuffle(Q.slice()).slice(0,10);
  score=0;idx=0;
  show('quiz');
  render();
};

document.getElementById('opts').onclick=function(e){
  var btn=e.target.closest('button');
  if(!btn)return;
  var i=parseInt(btn.getAttribute('data-i'));
  if(!isNaN(i))answer(i);
};

document.getElementById('btnShare').onclick=share;
document.getElementById('btnRetry').onclick=function(){location.reload();};

})();
</script>

</body>
</html>
