<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ロリコン</title>
<style>
  @font-face{font-family:'SRT';src:url('font.ttf') format('truetype');font-weight:400;font-display:swap}

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}

  body{
    font-family:'SRT','ZCOOL XiaoWei',-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    min-height:100dvh;min-height:-webkit-fill-available;
    background:linear-gradient(160deg,#fce4ec 0%,#f8d8e8 25%,#fce4f0 50%,#f3d8e8 75%,#fde8f0 100%);
    background-attachment:fixed;
    color:rgba(80,30,50,.8);
    display:flex;align-items:center;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  .bg{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
  .bg-1{width:300px;height:300px;background:rgba(255,150,180,.3);top:-80px;right:-60px}
  .bg-2{width:250px;height:250px;background:rgba(255,180,200,.25);bottom:8%;left:-90px}
  .bg-3{width:180px;height:180px;background:rgba(220,140,180,.28);top:40%;right:-50px}

  main{width:100%;max-width:420px;position:relative;z-index:1}

  .card{
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,200,215,.4);
    border-radius:24px;padding:36px 24px;
    box-shadow:0 8px 40px rgba(200,120,160,.08);
  }

  /* cover */
  .cover{text-align:center}
  .cover .icon-wrap{
    display:inline-flex;align-items:center;justify-content:center;
    width:80px;height:80px;border-radius:50%;
    background:rgba(255,220,235,.5);border:1px solid rgba(255,180,200,.4);
    margin-bottom:24px;
  }
  .cover .icon-wrap svg{width:38px;height:38px;color:#e8879f}
  .cover h1{
    font-size:26px;font-weight:700;margin-bottom:6px;
    color:#b8526a;letter-spacing:.5px;
  }
  .cover .sub{
    font-size:16px;color:rgba(180,90,120,.45);margin-bottom:18px;
    letter-spacing:2px;font-weight:400;
  }
  .cover .sep{width:40px;height:1.5px;background:rgba(220,140,170,.3);margin:0 auto 20px;border-radius:1px}
  .cover .desc{font-size:13px;color:rgba(150,80,110,.4);line-height:1.9;margin-bottom:18px}
  .cover .tag{
    display:inline-block;font-size:10px;color:rgba(180,100,130,.35);
    border:1px solid rgba(255,180,200,.3);border-radius:50px;padding:4px 14px;margin-bottom:12px;
  }

  .btn{
    display:inline-flex;align-items:center;
    background:#f098b4;border:none;
    color:#fff;padding:7px 22px;border-radius:24px;
    font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;
    font-family:inherit;letter-spacing:.3px;margin-top:6px;
    box-shadow:none;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  .btn:active{transform:scale(.95);opacity:.85}
  .btn-sm{padding:7px 18px;font-size:12px;margin-top:0}
  .btn svg{width:15px;height:15px;flex-shrink:0}

  /* progress */
  .quiz-top{
    position:sticky;top:0;z-index:10;padding:12px 0 14px;
    background:rgba(252,228,236,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:0 0 16px 16px;
  }
  .dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:100%}
  .dot{
    width:6px;height:6px;border-radius:50%;background:rgba(200,140,160,.2);
    transition:all .25s;flex-shrink:0;
  }
  .dot.past{background:rgba(220,130,160,.5)}
  .dot.now{background:#e8879f;box-shadow:0 0 8px rgba(220,120,150,.4);transform:scale(1.3)}
  .quiz-top .lbl{text-align:center;font-size:10px;color:rgba(180,100,130,.35);margin-top:8px;letter-spacing:1.5px}

  /* question */
  .q-num{font-size:10.5px;color:rgba(200,120,150,.5);font-weight:600;letter-spacing:2.5px;margin-bottom:16px}
  .q-text{font-size:18px;color:rgba(80,25,45,.78);line-height:1.6;margin-bottom:20px;font-weight:500}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.3);border:1px solid rgba(255,190,210,.3);
    border-radius:14px;padding:14px 16px;font-size:14px;color:rgba(90,35,55,.6);
    cursor:pointer;transition:all .18s;line-height:1.45;
    font-family:inherit;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  .opt:active{background:rgba(255,210,225,.45);border-color:rgba(240,140,170,.4);color:rgba(80,25,45,.8)}
  .opt.sel{background:rgba(255,200,220,.5);border-color:rgba(240,140,170,.5);color:#b8526a;box-shadow:0 0 16px rgba(220,120,160,.08)}
  .badge{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;
    background:rgba(255,220,235,.5);border:1px solid rgba(255,180,200,.35);
    text-align:center;line-height:24px;font-size:11px;font-weight:600;color:rgba(180,100,130,.35);
  }
  .opt.sel .badge{background:rgba(240,140,170,.25);border-color:rgba(235,120,155,.4);color:#d46884}
  .opt span:last-child{flex:1}

  .next-row{display:flex;justify-content:flex-end;margin-top:16px}

  /* result */
  .result{text-align:center}
  .result .icon-wrap{
    display:inline-flex;align-items:center;justify-content:center;
    width:72px;height:72px;border-radius:50%;
    background:rgba(255,220,235,.5);border:1px solid rgba(255,180,200,.4);
    margin-bottom:18px;
  }
  .result .icon-wrap svg{width:34px;height:34px;color:#e8879f}
  .result-badge{font-size:11px;color:rgba(200,120,150,.5);font-weight:600;letter-spacing:3px;margin-bottom:4px}
  .result-pct{
    font-size:48px;font-weight:800;letter-spacing:-1px;line-height:1.1;
    color:#b8526a;margin-bottom:4px;
  }
  .result-title{font-size:19px;font-weight:600;color:#b8526a;margin-bottom:16px}
  .result-text-card{
    background:rgba(255,255,255,.3);border:1px solid rgba(255,190,210,.3);
    border-radius:16px;padding:18px 16px;font-size:13.5px;
    color:rgba(100,40,60,.55);line-height:2;white-space:pre-line;
    text-align:center;
  }
  .btn-row{display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap}

  .note{font-size:11px;color:rgba(180,100,130,.3);margin-top:12px}
  .disclaimer{font-size:10px;color:rgba(180,120,140,.2);margin-top:4px}
  .page{animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="bg bg-1"></div>
<div class="bg bg-2"></div>
<div class="bg bg-3"></div>
<main id="app"></main>

<script>
var I={palette:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20"/><path d="M8 8h.01"/><path d="M16 8h.01"/><path d="M8 16c1.5 2 4 2 6 0"/></svg>',play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',arrowR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',replay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-8.7L1 10"/></svg>',share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 3.9"/><path d="M15.4 6.6l-6.8 3.9"/></svg>',wink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/><path d="M15 9v.5"/></svg>',smile:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>',meh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 15h8"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>',sad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>',xeyes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9l2 2"/><path d="M15 9l-2 2"/><path d="M9 9l2-2"/><path d="M15 9l-2-2"/></svg>'};

var Q=[{q:"第一眼看女生，你通常最先注意到？",o:["眼睛大不大、亮不亮","整体身形比例","穿搭有没有品味","气质和姿态"]},{q:"以下哪种脸型你更觉得舒服？",o:["偏圆润，线条柔和，有点婴儿肥","标准鹅蛋脸，比例精致","偏瘦长，棱角分明有气场","没注意过脸型"]},{q:"女生多高你觉得刚刚好？",o:["150 出头，娇小一只","160 左右，比较标准","165+，高挑有气场","身高不重要"]},{q:"以下哪种眼睛最吸引你？",o:["又圆又大，亮晶晶像会说话","细长勾人，有点魅","大小适中，双眼皮标致","看整体，眼睛不是决定性因素"]},{q:"你觉得女生最好看的发型是？",o:["双马尾，活泼元气","及腰长直发，温柔","齐耳短发，干练利落","大波浪，成熟有味道"]},{q:"齐刘海在你这儿是？",o:["加分，看起来乖巧可爱","看人，有的适合有的不适合","减分，显幼稚","没注意过刘海"]},{q:"看到女生穿短裙配过膝袜，你觉得？",o:["绝杀，太好看了","看整体搭配","不如光腿自然","有点刻意"]},{q:"女生什么体型最让你多看两眼？",o:["小骨架，瘦瘦小小一只","匀称有线条，健康感","曲线分明，有女人味","没关注过体型"]},{q:"一个人走路蹦蹦跳跳的，你觉得？",o:["挺可爱的，元气满满","有点不稳重","看年龄和场合","没注意过走路方式"]},{q:"女生歪头看着你表示疑惑，你心里？",o:["被戳中了，有点萌","正常表情，没什么特别","觉得这人是不是没听懂","没注意过歪头这个动作"]},{q:"笑起来眼睛弯成月牙的女生，你觉得？",o:["治愈，看到也想跟着笑","挺亲切的","不如露齿大笑好看","没注意过笑起来的眼睛"]},{q:"袖子长过手指，只露出指尖，你觉得？",o:["很有感觉，像小动物","衣服不合身吧","一种穿搭风格","没注意过这种细节"]},{q:"双手捧着一个杯子慢慢喝东西，你觉得？",o:["画面很乖，有点温馨","正常动作，没什么","太小心翼翼了","没观察过喝水姿势"]},{q:"踮脚够高处东西够不着的样子？",o:["挺可爱的，想帮忙","有点狼狈","正常，个子矮没办法","没注意过这种场景"]},{q:"女生躲在别人身后只探出半个头看你？",o:["这个动作杀我","是不是太害羞了","有点做作","没注意过"]},{q:"说话带「呀」「嘛」「呢」之类的尾音，你觉得？",o:["软软的，听着很舒服","正常，很多人这样","有点嗲，不太喜欢","没注意过语气词"]},{q:"鼓腮帮子这个动作，你觉得？",o:["犯规级别的可爱","偶尔做还行，别频繁","有点幼稚","没注意过"]},{q:"女生困了揉眼睛的样子？",o:["很柔软，想让她去睡","正常，谁困了都揉","显得没精神","没注意过"]},{q:"看番时你对哪种女角色最容易有好感？",o:["需要被保护的那一类型","可靠成熟的大姐姐型","冷酷寡言但内心温柔型","搞笑担当气氛组"]},{q:"你觉得女生最好的皮肤状态是？",o:["白里透粉，看着就很软","健康自然，有点瑕疵也真实","小麦色，有光泽","皮肤好不好不重要"]},{q:"你觉得肩膀窄窄的女生？",o:["很有保护欲，看起来柔和","正常，女生肩膀本来就比男生窄","不如宽肩撑衣服好看","没关注过肩膀"]},{q:"小步快跑这个动作，你觉得？",o:["很灵动，像小鸟","正常跑步姿势而已","不够大方","没注意过跑步"]},{q:"说话声音偏软偏细的女生？",o:["喜欢，听着很舒服","正常，每个人音色不同","有点刺耳，容易听不清","不在意声音"]},{q:"穿 oversize 卫衣显得整个人小小的？",o:["很戳我，反差感","休闲穿搭，正常","不如穿合身的显精神","没注意过"]},{q:"女生不经意间拉你袖子的动作？",o:["心跳会漏一拍","有被需要的感觉","有点越界了","没经历过"]},{q:"你觉得「软」是用来夸人的吗？",o:["是，而且是高度赞美","中性词，描述性格或外表","不太算，说明没主见","没用过这个词形容人"]},{q:"以下哪种场景你最容易被触动？",o:["一个很小的身影在努力做一件很大的事","两个势均力敌的人激烈对抗","一个人沉默地扛下所有","一群朋友嬉闹的日常"]},{q:"你觉得女生最加分的配饰是？",o:["小小的蝴蝶结发夹","简约精致的耳环","有质感的手表","不觉得配饰能加分"]},{q:"你觉得「天真」和「幼稚」的区别是？",o:["天真是褒义，幼稚是贬义，但都跟年龄无关","差不多，只是语气的区别","过了某个年龄天真就是幼稚","没细想过这两个词"]},{q:"做完这个测试，你觉得它在测什么？",o:["审美偏好 / 喜欢的类型","性格深层投射","恋爱倾向","完全猜不到"]}];

var L=['A','B','C','D'];

function result(pct){
  if(pct>=90)return{icon:'wink',title:"典，太典了。",text:"别解释。解释就是掩饰。\n你点进来那一刻我就知道了。\n正常人不会在「踮脚够不到东西」那道题上想超过两秒。\n你喜欢大眼睛、小动作、软乎乎的那一款——\n不是喜欢，是看到就走不动路。\n二次元也好三次元也好，\n你的心跳永远为「小小一只」加速。\n注意分寸，祝你好运。"};
  if(pct>=65)return{icon:'smile',title:"有说法，但不承认。",text:"你嘴上说「我只是觉得可爱而已」——\n但你猜为什么可爱那么多款你偏偏觉得这款可爱。\n你就是喜欢那种眼里亮晶晶、笑起来像小太阳、\n让你忍不住想揉脑袋的类型。\n别人问你理想型，你描述了半天，\n对方说——「你说的是不是那个谁来着？」\n懂的都懂。只是你还没承认。"};
  if(pct>=40)return{icon:'meh',title:"正常人，别紧张。",text:"你的审美比较正常，没什么特别的偏向。\n有时候刷到可爱向的视频会停下来看两眼，\n但转头又能欣赏成熟大姐姐。\n你喜欢的东西比较杂，\n自己都说不清楚到底吃哪一款。\n但测试显示你选了几个关键题的答案——\n你自己可能都没注意到。\n没事，不重要，继续做你的杂食党。"};
  if(pct>=15)return{icon:'sad',title:"你不是。下一个。",text:"这款对你来说大概率无感，\n甚至有点不理解别人为什么上头。\n你觉得成熟、知性、\n或者干脆飒爽利落的类型更吸引你。\n选到大眼睛双马尾的那些选项时，\n你基本都选了 C 或 D。\n你不是目标用户。\n但来都来了，截图发群里看看朋友什么分数。"};
  return{icon:'xeyes',title:"你来做这个测试干嘛？",text:"你全程大概在想「这些选项有什么区别」。\n别人看的是萌点，你看的是——\n什么都没看，你直接划过去了。\n你甚至可能觉得上面那些鉴定结果\n都写的是中文但你看不懂。\n没关系，这是好事。\n你的审美雷达和你本人一样纯粹——\n纯粹不在这个频道上。\n发群里能拿最高赞，\n因为所有人都觉得你的结果最好笑。"};
}

var answers=[],cur=0;

function icon(name){
  var d=document.createElement('span');
  d.className='icon-wrap';
  d.innerHTML=I[name];
  return d;
}

function h(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k];
    if(k==='c')e.className=v;
    else if(k==='h')e.innerHTML=v;
    else if(k==='t')e.textContent=v;
    else if(k[0]==='o')e.addEventListener(k.slice(1),v);
    else e.setAttribute(k,v);
  }
  if(kids)for(var i=0;i<kids.length;i++){
    var c=kids[i];
    e.append(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

function cover(){
  document.body.style.alignItems='center';
  var app=document.getElementById('app');app.innerHTML='';app.className='page';
  app.appendChild(
    h('div',{c:'card cover'},[
      icon('palette'),
      h('h1',{t:'测试你是不是萝莉控'}),
      h('div',{c:'sub',t:'ロリコン'}),
      h('div',{c:'sep'}),
      h('div',{c:'desc',t:'30 道题 · 探索你的隐藏属性'}),
      h('button',{c:'btn',oclick:function(){answers=[];cur=0;quiz();}},'开始大调查'),
      h('div',{c:'note',t:'仅供娱乐'}),
      h('div',{c:'disclaimer',t:'本测试由AI生成，仅供玩笑，不要当真'})
    ])
  );
}

function quiz(){
  document.body.style.alignItems='flex-start';
  var app=document.getElementById('app');app.innerHTML='';app.className='page';
  var q=Q[cur];
  var dots=[];
  for(var j=0;j<30;j++)dots.push(h('div',{c:'dot'+(j<cur?' past':j===cur?' now':'')}));

  var top=h('div',{c:'quiz-top'},[
    h('div',{c:'dots'},dots),
    h('div',{c:'lbl',t:(cur+1)+' / 30'})
  ]);

  var opts=[];
  for(var j=0;j<q.o.length;j++){
    (function(idx){
      opts.push(h('div',{c:'opt',oclick:function(e){
        var all=this.parentNode.querySelectorAll('.opt');
        for(var x=0;x<all.length;x++)all[x].classList.remove('sel');
        this.classList.add('sel');
      }},[
        h('span',{c:'badge',t:L[idx]}),
        h('span',{t:q.o[idx]})
      ]));
    })(j);
  }

  var card=h('div',{c:'card'},[
    h('div',{c:'q-num',t:'QUESTION '+(cur+1)}),
    h('div',{c:'q-text',t:q.q}),
    h('div',{c:'opts'},opts),
    h('div',{c:'next-row'},[
      h('button',{c:'btn btn-sm',oclick:function(){
        var sel=card.querySelector('.opt.sel');
        if(!sel){alert('请先选择一个选项');return;}
        var all=card.querySelectorAll('.opt');
        for(var x=0;x<all.length;x++){if(all[x]===sel){answers.push(x);break;}}
        if(cur<29){cur++;quiz()}else{showResult()}
      }},[icon('arrowR'),'下一题'])
    ])
  ]);

  app.appendChild(top);
  app.appendChild(card);
}

function showResult(){
  document.body.style.alignItems='center';
  var a=0;
  for(var i=0;i<answers.length;i++){if(answers[i]===0)a++;}
  var pct=Math.round(a/30*100);
  var r=result(pct);

  var app=document.getElementById('app');app.innerHTML='';app.className='page';
  app.appendChild(
    h('div',{c:'card result'},[
      icon(r.icon),
      h('div',{c:'result-badge',t:'调 查 结 果'}),
      h('div',{c:'result-pct',t:'纯度 '+pct+'%'}),
      h('div',{c:'result-title',t:r.title}),
      h('div',{c:'result-text-card',t:r.text}),
      h('div',{c:'btn-row'},[
        h('button',{c:'btn btn-sm',oclick:function(){answers=[];cur=0;quiz()}},'再测一次'),
        h('button',{c:'btn btn-sm',oclick:function(){
          var txt='🎀 ロリコン调查\n纯度 '+pct+'%\n'+r.title+'\n'+r.text.split('\n').slice(0,3).join('\n');
          if(navigator.share)navigator.share({title:'ロリコン调查',text:txt}).catch(function(){});
          else navigator.clipboard.writeText(txt).then(function(){alert('已复制！')}).catch(function(){});
        }},'分享结果')
      ])
    ])
  );
}

cover();
</script>
</body>
</html>
